<style>
:root{--bg:#fff;--ink:#000;--mute:#6b6b6b;--line:#000}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);color:var(--ink)}
body{font-family:'Archivo','Helvetica Neue',Arial,sans-serif;font-weight:500;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:clamp(28px,6vw,72px) 20px 40px}
main{width:100%;max-width:880px}
.logo{display:block;width:min(100%,560px);height:auto;margin:6vh auto 0}
.tag{text-align:center;margin-top:28px;font-size:clamp(17px,2.4vw,22px);color:var(--mute)}
.ca{margin:64px auto 0;max-width:720px}
.ca p{font-size:15px;color:var(--mute);margin-bottom:8px}
.ca button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;border:2.5px solid var(--line);padding:16px 18px;cursor:pointer;font-weight:800}
.ca button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.ca code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(12px,2.6vw,16px);word-break:break-all;font-weight:700}
.ca span{flex:none;background:var(--ink);color:#fff;padding:6px 14px;font-size:14px}
.chart{margin:48px auto 0;border:2.5px solid var(--line)}
.chart iframe{display:block;width:100%;height:clamp(420px,70vh,640px);border:0}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:32px}
nav a{color:var(--ink);text-decoration:none;font-weight:800;border:2.5px solid var(--line);padding:12px 22px}
nav a:first-child{background:var(--ink);color:#fff}
nav a:hover{background:var(--ink);color:#fff}
nav a:first-child:hover{background:#fff;color:var(--ink)}
nav a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
footer{margin-top:56px;font-size:13px;color:var(--mute);text-align:center;max-width:560px}
</style>
</head>
